# Publica un APK firmado en GitHub Releases al subir un tag vX.Y.Z (ver docs/11-versiones-y-actualizaciones.md).
# La app instalada consulta el último release y ofrece descargarlo e instalarlo.
name: Release Android
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: android-release
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: produccion
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Versión y firma
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v([0-9]{1,4}\.[0-9]{1,2}\.[0-9]{1,2})$ ]] || { echo "El tag debe ser vX.Y.Z, por ejemplo v1.2.0"; exit 1; }
          echo "VERSION_NAME=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          # master es producción: solo se publica lo que ya está en master (develop es para pruebas).
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || { echo "El tag $GITHUB_REF_NAME no apunta a un commit de master. Fusiona develop en master y crea el tag ahí."; exit 1; }
          for name in SUPABASE_URL SUPABASE_ANON_KEY ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do
            test -n "${!name}" || { echo "Falta el secret $name (Settings > Secrets and variables > Actions)"; exit 1; }
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: ./gradlew :domain:test :data:testDebugUnitTest :app:testDebugUnitTest :app:assembleRelease
      - name: Verificar el escáner en el build minificado
        # Sin estos constructores ML Kit no se inicializa y el escáner falla solo en release (v1.0.0).
        run: |
          for c in com.google.mlkit.common.internal.CommonComponentRegistrar com.google.mlkit.vision.common.internal.VisionCommonRegistrar com.google.mlkit.vision.barcode.internal.BarcodeRegistrar; do
            awk -v c="$c" '$0 ~ "^"c" -> " {f=1; next} /^[^ #]/ {f=0} f && /void <init>\(\)/ {ok=1} END {exit !ok}' app/build/outputs/mapping/release/mapping.txt \
              || { echo "R8 eliminó el constructor de $c (ver app/proguard-rules.pro)"; exit 1; }
          done
      - name: Publicar en GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="control-tienda-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          # Las notas son el mensaje del tag (git tag -a vX.Y.Z -m "..."); la app las muestra al ofrecer la versión.
          git fetch --force --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" "$apk" --verify-tag --title "Control Tienda $GITHUB_REF_NAME" --notes-file notes.md
      - name: Mapping de R8 (para leer errores de la versión publicada)
        uses: actions/upload-artifact@v7
        with:
          name: mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt
